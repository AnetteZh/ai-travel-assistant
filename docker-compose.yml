# Запуск: docker compose up --build  →  http://localhost:8080
name: odin-zapros

services:
  core:
    build:
      context: .
      dockerfile: Dockerfile
    image: odin-zapros-core:0.1.0
    # .env.example даёт значения по умолчанию, .env (если есть) их переопределяет.
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      TRAVEL_DATA_WORLD_PATH: /app/data/world.json
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: odin-zapros-app:0.1.0
    environment:
      CORE_API_URL: http://core:8000
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
