
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ostrovok-travel-data"
version = "0.1.0"
description = "Synthetic travel world and data tools for an AI travel agent prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
langgraph = [
    "langchain-core>=0.3,<2",
    "langchain>=0.3,<2",
    "langgraph>=0.2,<2",
    "langchain-openai>=0.3,<2",
    "langchain-gigachat>=0.5,<1",
]

api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

test = [
    "pytest>=8,<10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
travel_data = ["data/*.json"]
agent_core = ["prompts.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
